<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrice de Génération - En attente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-4xl mx-auto px-4 py-16 text-center">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">
      Matrice de Génération de Sites
    </h1>
    <p class="text-lg text-gray-600 mb-8">
      Aucun site n'a encore été généré.
    </p>
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 text-left">
      <h2 class="text-lg font-semibold text-blue-900 mb-3">
        📋 Pour générer les 27 sites :
      </h2>
      <ol class="list-decimal list-inside space-y-2 text-gray-700">
        <li>Lancez le serveur de développement : <code class="bg-gray-200 px-2 py-1 rounded">npm run dev</code></li>
        <li>Exécutez la matrice de tests : <code class="bg-gray-200 px-2 py-1 rounded">npm run test:matrix:run</code></li>
        <li>Rafraîchissez cette page pour voir les résultats</li>
      </ol>
    </div>
  </div>
</body>
</html>
